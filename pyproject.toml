[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "delta-contact-network-bot"
version = "0.7.6"
description = "Privacy-conscious contact network bot for Delta Chat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<47",
  "deltachat2==2.58.0",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.11", "httpx>=0.28,<1"]

[project.scripts]
contactbot = "contactbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/contactbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
