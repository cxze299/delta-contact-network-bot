# Include inside the Synology DSM server block. Invitation routes only.
location = /join {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Authorization "";
}
location = /join.js {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Authorization "";
}
location = /api/public-invite {
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Authorization "";
}
